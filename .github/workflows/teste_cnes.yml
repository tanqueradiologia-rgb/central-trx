name: Teste fontes CNES
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Testes
        run: |
          n(){ echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-900)"; }
          n "API: $(curl -s -m 60 'https://apidadosabertos.saude.gov.br/cnes/estabelecimentos?codigo_municipio=520870&limit=1' | head -c 300)"
          for m in 202609 202608; do n "BASE $m: $(curl -sI -m 60 "https://cnes.datasus.gov.br/EstatisticasServlet?path=BASE_DE_DADOS_CNES_${m}.ZIP" | head -6)"; done
          n "FTP EQ: $(curl -s -m 90 --list-only 'ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/EQ/' | grep -E '^EQGO2' | sort | tail -3)"
          n "FTP SR: $(curl -s -m 90 --list-only 'ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/SR/' | grep -E '^SRGO2' | sort | tail -3)"
          pip install -q pyreaddbc dbfread >/dev/null 2>&1 || n "pip falhou"
          for t in EQ SR; do
            f=$(curl -s -m 90 --list-only "ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/$t/" | grep -E "^${t}GO2" | sort | tail -1)
            curl -s -m 180 -o x.dbc "ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/$t/$f"
            n "$t arquivo $f tamanho $(stat -c %s x.dbc 2>/dev/null)"
            n "$t conteudo: $(python -c "
          import pyreaddbc, dbfread
          pyreaddbc.dbc2dbf('x.dbc','x.dbf')
          t=dbfread.DBF('x.dbf',encoding='latin-1')
          rs=[dict(r) for _,r in zip(range(2),t)]
          print(t.field_names, rs)
          " 2>&1 | tail -c 800)"
          done
