name: Migração única dos arquivos do Mac para planilhas
on:
  workflow_dispatch: {}
jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth google-api-python-client openpyxl
      - name: Migrar
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/migrar_mac_para_planilhas.py
