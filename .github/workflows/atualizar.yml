name: Atualizar Central TRX

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min, o dia todo (o GitHub pode atrasar alguns minutos)
    - cron: "37 * * * *"     # rodada de hora em hora que também roda o radar PNCP
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install --quiet google-auth google-api-python-client openpyxl
      - name: Baixar as planilhas
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/buscar_planilhas.py
      # Se a sincronização falhar, a página continua sendo publicada com o que já está
      # na planilha Google de licitações; a falha aparece em vermelho no Actions.
      - name: Levar o robô para a planilha Google de licitações
        id: sync
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          python scripts/aplicar_medicoes.py
          python scripts/sincronizar_licitacoes.py Pipeline_Licitacoes.xlsx
      # Radar PNCP na nuvem: de hora em hora (e em toda rodada manual ou por push).
      - name: Radar PNCP (editais abertos de telerradiologia)
        id: radar
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "37 * * * *" ]; then
            python scripts/radar_pncp.py
          else
            echo "Radar roda só na rodada de hora em hora (cron 37)."
          fi
      - name: Ler a planilha Google de licitações
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/buscar_planilhas.py --so-licitacoes
      - name: Gerar os dados da página
        run: |
          set -a; . ./mods.env; set +a
          python scripts/build_central.py --pipeline pipeline.json --licitacoes licitacoes.json \
            --saida site/dados_central.js --mod-pipeline "$MOD_PIPELINE" --mod-licitacoes "$MOD_LICIT_SHEET"
          # evita que o navegador mostre dados velhos guardados em cache
          sed -i "s#dados_central.js\"#dados_central.js?v=${GITHUB_RUN_ID}\"#; s#saude.js\"#saude.js?v=${GITHUB_RUN_ID}\"#" site/index.html
      - name: Verificação automática (motores e regras)
        run: |
          set -a; . ./mods.env; set +a
          python scripts/verificar_central.py
      - name: Avisar se a sincronização falhou
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::A sincronização com a planilha de licitações falhou nesta rodada; a página saiu com os dados da planilha como estavam."
      - name: Avisar se o radar PNCP falhou
        if: steps.radar.outcome == 'failure'
        run: echo "::warning::O radar PNCP falhou nesta rodada."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
  # Este passo mensal registra atividade para a atualização nunca parar.
  manter-ativo:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar atividade no dia 1
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H%M)" \< "0010" ]; then
            date -u +%Y-%m-%d > .ativo
            git config user.name "central-trx-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .ativo && git commit -m "Manter agendamento ativo" && git push || true
          fi
